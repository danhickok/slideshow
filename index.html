<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <title>Slideshow</title>

    <link rel="stylesheet" href="dist/reset.css" />
    <link rel="stylesheet" href="dist/reveal.css" />
    <link rel="stylesheet" href="dist/theme/white.css" />
  </head>
  <body>
    <div class="reveal">
      <div class="slides">
        <section
          data-markdown="content.md"
          data-separator="^\r?\n---\r?\n$"
          data-separator-vertical="^\r?\n\(---\)\r?\n$"
          data-separator-notes="^\r?\n===\r?\n$"
          data-charset="utf-8"></section>
        <section data-background-color="black">
          <!-- The last slide is plain black -->
        </section>
      </div>
    </div>

    <script src="dist/reveal.js"></script>
    <script src="dist/plugin/notes.js"></script>
    <script src="dist/plugin/markdown.js"></script>
    <script src="dist/plugin/zoom.js"></script>
    <script src="scripts/simplifier.js"></script>
    <script src="scripts/verse-formatter.js"></script>
    <script src="scripts/perform-scroll.js"></script>
    <script>
          Reveal.initialize({
            width: 1920,
            height: 1080,
            margin: 0.07,
            minScale: 0.2,
            maxScale: 4.0,
            hash: true,
            plugins: [RevealMarkdown, Simplifier, VerseFormatter, RevealNotes, RevealZoom],
            transition: "fade",
            transitionSpeed: "fast",
            slideNumber: true,
            markdown: {
              smartypants: true,
            },
            keyboard: {
              38: () => { performScroll('up') },
              40: () => { performScroll('down') },
            },
          });
    </script>
  </body>
</html>
<!-- This is an improvement, but doesn't work when using speaker view - only speaker view scrolls -->
