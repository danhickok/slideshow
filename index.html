<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <title>Slideshow</title>

    <link rel="stylesheet" href="dist/reset.css" />
    <link rel="stylesheet" href="dist/reveal.css" />
    <link rel="stylesheet" href="dist/theme/white-roboto.css" />
    <link rel="stylesheet" href="styles/slideshow.css" />
  </head>
  <body>
    <div class="reveal">
      <div class="slides">
        <section
          data-markdown="content.md"
          data-separator="^\r?\n---\r?\n$"
          data-separator-vertical="^\r?\n\(---\)\r?\n$"
          data-separator-notes="^\r?\n===\r?\n$"
          data-charset="utf-8"></section>
        <section data-background-color="black">
          <!-- The last slide is plain black -->
        </section>
      </div>
    </div>
    <script type="module">
      import Reveal from "./dist/reveal.mjs";
      import Notes from "./dist/plugin/notes.mjs"
      import Markdown from "./dist/plugin/markdown.mjs"
      
      import Simplifier from "./scripts/simplifier.mjs";
      import VerseFormatter from "./scripts/verse-formatter.mjs";

      import { establishScrollChannel, performScroll, broadcastScroll } from "./scripts/scroller.mjs";
      import { establishPointerChannel, togglePointer } from "./scripts/pointer.mjs";

      Reveal.initialize({
        width: 1920,
        height: 1080,
        margin: 0.07,
        minScale: 0.2,
        maxScale: 4.0,
        hash: true,
        plugins: [Markdown, Simplifier, VerseFormatter, Notes],
        transition: "fade",
        transitionSpeed: "fast",
        slideNumber: true,
        controls: false,
        markdown: {
          smartypants: true,
        },
        keyboard: {
          // up  arrow
          38: () => {
            performScroll("up");
            broadcastScroll("up");
          },
          // down arrow
          40: () => {
            performScroll("down");
            broadcastScroll("down");
          },
          // "P" key
          80: () => {
            togglePointer();
          },
        },
      }).then(() => {
        establishScrollChannel();
        establishPointerChannel();
      });

      // called when each slide appears
      Reveal.on("slidechanged", (event) => {
        const scrollableDiv = event.currentSlide.querySelector(".scrollable");
        if (scrollableDiv) {
          scrollableDiv.scrollTop = 0;
        }
      });
    </script>
  </body>
</html>
